.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

.rw{border-radius:4px;padding:0 1px;transition:background .1s}
.rep{width:5.5em;text-align:center;font-family:var(--en);font-size:1rem}
.trl{display:flex;flex-direction:column;gap:4px;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}

  if(onb)u.onboundary=e=>{if(!e.name||e.name==='word')onb(e.charIndex)};
  u.onstart=()=>el&&el.classList.add('speaking');

  speechSynthesis.speak(u);
}

const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g,' ').split(/\s+/).filter(Boolean);
function compare(target,said){
  const T=target.split(/\s+/).filter(Boolean),tn=T.map(w=>norm(w).join('')),U=norm(said);
  const n=tn.length,mm=U.length,dp=Array.from({length:n+1},()=>new Array(mm+1).fill(0));
  for(let a=n-1;a>=0;a--)for(let b=mm-1;b>=0;b--)dp[a][b]=tn[a]&&tn[a]===U[b]?dp[a+1][b+1]+1:Math.max(dp[a+1][b],dp[a][b+1]);
  const hit=new Array(n).fill(false);let a=0,b=0;
  while(a<n&&b<mm){if(tn[a]&&tn[a]===U[b]){hit[a]=true;a++;b++}else if(dp[a+1][b]>=dp[a][b+1])a++;else b++}
  const valid=tn.filter(Boolean).length||1,got=hit.filter(Boolean).length;
  return {score:got/valid,html:T.map((w,k)=>`<span class="wd ${hit[k]||!tn[k]?'hit':'miss'}">${esc(w)}</span>`).join(' '),miss:T.filter((w,k)=>!hit[k]&&tn[k]).map(w=>w.replace(/[.,?!]/g,''))};
}

      $('fshow').onclick=()=>{$('fa').textContent=w[1]};
      $('fagain').onclick=()=>{flash.list.push(w);flash.k++;render()};
      $('fknow').onclick=()=>{S.known[w[0]]=1;today();save();flash.k++;render()};}
    $('fexit').onclick=()=>{flash=null;render()};
  }else{
    m.querySelectorAll('.v').forEach(b=>{const w=t[1][b.dataset.k];let last=0;
      b.onclick=()=>{const now=Date.now();if(now-last<350){if(S.known[w[0]])delete S.known[w[0]];else{S.known[w[0]]=1;today()}save();render();return}last=now;hush();speak(w[0],b)}});
    $('fstart').onclick=()=>{const un=t[1].filter(w=>!S.known[w[0]]);flash={list:(un.length?un:t[1]).slice(),k:0};render()};
    $('fall').onclick=()=>{hush();let k=0;const bs=m.querySelectorAll('.v');const nx=()=>{if(k>=t[1].length)return;const b=bs[k];speak(t[1][k++][0],b,()=>setTimeout(nx,350))};nx()};
  }
}

/* ===================== LISTENING ===================== */
let showText={};
function drawListen(){
  const m=$('main');
  let h=`<div><div class="eyebrow">الاستماع · ${metrics().lis} من ${DIA.length} حوارات</div><h2>حوارات من الحياة والعمل</h2></div>
    <p class="muted" style="margin:0">اسمع الحوار أولًا بدون نص، ثم جاوب. إذا صعب عليك، أظهر النص واسمع مرة ثانية.</p>`;
  h+=DIA.map((d,k)=>`<section id="d${k}"><h3>${d.t} ${S.lis[k]?'<span class="badge b-done">✓</span>':''}</h3>
    <div class="row" style="margin:0 0 10px"><button class="btn pri" type="button" data-play="${k}">▶ شغّل الحوار</button><button class="btn" type="button" data-txt="${k}">${showText[k]?'إخفاء النص':'أظهر النص'}</button></div>
    <div class="say" ${showText[k]?'':'hidden'}>`+d.l.map(x=>`<button class="line" type="button" data-t="${esc(x[1])}" data-who="${x[0]}"><span class="who">${x[0]}</span><div><b>${esc(x[1])}</b>${S.hideAr?'':`<small>${x[2]}</small>`}</div></button>`).join('')+`</div>
    <div class="qz" style="margin-top:12px">${quizHTML(d.q)}</div></section>`).join('');
  m.innerHTML=h;
  m.querySelectorAll('.line[data-t]').forEach(b=>b.onclick=()=>{hush();speak(b.dataset.t,b,null,b.dataset.who)});
  m.querySelectorAll('[data-txt]').forEach(b=>b.onclick=()=>{const k=b.dataset.txt;showText[k]=!showText[k];render();$('d'+k).scrollIntoView({block:'start'})});
  m.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{hush();const k=+b.dataset.play,d=DIA[k],lines=$('d'+k).querySelectorAll('.line');let n=0;
    const nx=()=>{if(n>=d.l.length)return;const x=d.l[n];speak(x[1],lines[n++],()=>setTimeout(nx,450),x[0])};nx()});
  DIA.forEach((d,k)=>wireQuiz($('d'+k).querySelector('.qz'),d.q,()=>{S.lis[k]=1}));
}

/* ===================== READING ===================== */
function wrapWords(p){let o='',last=0;p.replace(/\S+/g,(w,i)=>{o+=esc(p.slice(last,i))+`<span class="rw" data-s="${i}">${esc(w)}</span>`;last=i+w.length});return o+esc(p.slice(last))}
function drawRead(){
  const m=$('main');
  let h=`<div><div class="eyebrow">القراءة · ${metrics().rd} من ${RD.length} نصوص</div><h2>نصوص قصيرة</h2></div>
    <p class="muted" style="margin:0">اقرأ النص مرتين بدون مساعدة، ثم جاوب. زر 🔊 يقرأ لك النص لو احتجت.</p>`;
  h+=RD.map((r,k)=>`<section id="r${k}"><h3>${r.t} ${S.rd[k]?'<span class="badge b-done">✓</span>':''}</h3>
    <p class="passage" style="white-space:pre-line" id="pp${k}">${wrapWords(r.p)}</p>
    <div class="row"><button class="btn" type="button" data-tr="${k}">${S.trOpen&&S.trOpen[k]?'إخفاء الترجمة':'🌐 أظهر الترجمة'}</button></div>
    <div class="trl" id="tr${k}" ${S.trOpen&&S.trOpen[k]?'':'hidden'}>${r.tr.map((t,j)=>`<div class="trs" data-j="${j}">${t[1]}</div>`).join('')}</div>
    <div class="row"><button class="btn pri" type="button" data-rd="${k}">🔊 اقرأ لي النص</button>
      <label class="muted" for="rep${k}">عدد التكرار</label>
      <input id="rep${k}" class="btn rep" data-rep="${k}" type="number" inputmode="numeric" min="1" max="100" value="${S.rep||1}" aria-label="عدد التكرار">
      <button class="btn" type="button" data-stop="${k}" hidden>■ إيقاف</button>
      <span class="muted" id="cnt${k}"></span></div>
    <div class="qz" style="margin-top:12px">${quizHTML(r.q)}</div></section>`).join('');
  m.innerHTML=h;
  const stopAll=()=>{hush();m.querySelectorAll('[data-stop]').forEach(x=>x.hidden=true);m.querySelectorAll('[id^="cnt"]').forEach(x=>x.textContent='')};
  const clampRep=v=>Math.max(1,Math.min(100,parseInt(v)||1));
  m.querySelectorAll('[data-rep]').forEach(s=>s.onchange=()=>{const v=clampRep(s.value);S.rep=v;save();m.querySelectorAll('[data-rep]').forEach(o=>o.value=v)});
  m.querySelectorAll('[data-stop]').forEach(b=>b.onclick=stopAll);
  m.querySelectorAll('[data-tr]').forEach(b=>b.onclick=()=>{const k=b.dataset.tr;S.trOpen=S.trOpen||{};S.trOpen[k]=!S.trOpen[k];save();$('tr'+k).hidden=!S.trOpen[k];b.textContent=S.trOpen[k]?'إخفاء الترجمة':'🌐 أظهر الترجمة'});
  m.querySelectorAll('[data-rd]').forEach(b=>b.onclick=()=>{
    stopAll();const k=b.dataset.rd,me=RR,total=clampRep($('rep'+k).value),txt=RD[k].p.replace(/\n/g,' ');
    const cnt=$('cnt'+k),st=m.querySelector(`[data-stop="${k}"]`);st.hidden=false;let i=0;
    const nx=()=>{if(me!==RR)return;if(i>=total){cnt.textContent=`✓ انتهت ${total} مرات`;st.hidden=true;return}
      i++;cnt.textContent=`القراءة ${i} from ${total}`.replace('from','من');const ws=[...$('pp'+k).querySelectorAll('.rw')];
      const ts=[...$('tr'+k).querySelectorAll('.trs')],st0=RD[k].tr.map(t=>RD[k].p.indexOf(t[0]));
      const lit=c=>{let w=null;for(const x of ws){if(+x.dataset.s<=c)w=x;else break}ws.forEach(x=>x.classList.toggle('on',x===w));w&&w.scrollIntoView({block:'nearest'});
        let si=-1;st0.forEach((o,j)=>{if(o>=0&&o<=c)si=j});ts.forEach((x,j)=>x.classList.toggle('on',j===si))};
      speak(txt,b,()=>{ws.forEach(x=>x.classList.remove('on'));ts.forEach(x=>x.classList.remove('on'));if(me===RR)setTimeout(nx,1200)},null,lit)};
    nx();});
  RD.forEach((r,k)=>wireQuiz($('r'+k).querySelector('.qz'),r.q,()=>{S.rd[k]=1}));
}

/* ===================== TOOLS ===================== */
function setRate(r){S.rate=r;save();[['vslow',.5],['slow',.75],['normal',1]].forEach(([id,v])=>$(id).classList.toggle('on',v===r))}
$('vslow').onclick=()=>setRate(.5);$('slow').onclick=()=>setRate(.75);$('normal').onclick=()=>setRate(1);
function arBtn(){$('hideAr').classList.toggle('on',S.hideAr);$('hideAr').textContent=S.hideAr?'إظهار الترجمة':'إخفاء الترجمة'}
$('hideAr').onclick=()=>{S.hideAr=!S.hideAr;arBtn();save();render()};
$('main').addEventListener('click',e=>{const b=e.target.closest('.qt');if(b){hush();speak(b.dataset.q,b)}});
setRate([.5,.75,1].includes(S.rate)?S.rate:.75);arBtn();render();
</script>

</body></html>
