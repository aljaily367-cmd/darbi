:root{padding-top:env(safe-area-inset-top,0px)}
:root{
 --navy:#1D3A5F;--orange:#F0A030;--bg:#F3F5F8;--card:#FFFFFF;--fg:#15202E;--muted:#617085;--line:#E1E6ED;
 --good:#1E8A5A;--goodbg:#E3F4EC;--bad:#C2413A;--badbg:#FBE7E5;--soft:#EAF0F7;
 --display:"Lalezar","IBM Plex Sans Arabic",system-ui,sans-serif;--body:"IBM Plex Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1722;--card:#18222F;--fg:#E7ECF2;--muted:#94A2B4;--line:#263345;--goodbg:#143426;--badbg:#3A1C1A;--good:#4CC38A;--bad:#F07A72;--soft:#1F2C3C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1722;--card:#18222F;--fg:#E7ECF2;--muted:#94A2B4;--line:#263345;--goodbg:#143426;--badbg:#3A1C1A;--good:#4CC38A;--bad:#F07A72;--soft:#1F2C3C;color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:hidden;max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
header{background:var(--navy);color:#fff;padding-block:18px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--display);font-size:30px;line-height:1;display:inline-block}
.brand::after{content:"";display:block;height:4px;background:var(--orange);border-radius:2px;margin-top:4px}
.sub{font-size:13px;opacity:.8;margin-top:8px}
main{padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
h2{font-size:16px;margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi small{color:var(--muted);font-size:12px}.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--navy);border-radius:4px}

.muted{color:var(--muted);font-size:13px}
.good{color:var(--good)}.bad{color:var(--bad)}
.alert{background:var(--badbg);color:var(--bad);border-radius:10px;padding:10px;font-size:13px}
.ok{background:var(--goodbg);color:var(--good);border-radius:10px;padding:10px;font-size:13px}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 14px;background:var(--navy);color:#fff;font-weight:500}
button.ghost{background:var(--soft);color:var(--fg)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.form .full{grid-column:1/-1}
.prayers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pr{background:var(--soft);color:var(--muted);padding:10px 0;font-size:13px;border-radius:10px}
.pr.on{background:var(--goodbg);color:var(--good)}
.tasbih{width:120px;height:120px;border-radius:50%;font-size:34px;font-family:var(--display);align-self:center;background:var(--navy);box-shadow:0 0 0 6px var(--soft)}
.habit{display:flex;align-items:center;gap:10px;font-size:14px}
.chk{width:30px;height:30px;padding:0;border-radius:8px;background:var(--soft);color:var(--good);font-size:16px;flex:none}
.chk.on{background:var(--good);color:#fff}
.week{display:flex;gap:3px;margin-inline-start:auto}.week i{width:8px;height:8px;border-radius:2px;background:var(--soft)}.week i.on{background:var(--good)}
.x{background:none;color:var(--muted);padding:4px 8px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav button{background:none;color:var(--muted);border-radius:0;padding:10px 0;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.act{color:var(--navy)}
:root[data-theme="dark"] nav button.act{color:var(--orange)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav button.act{color:var(--orange)}}
nav button.act::after{content:"";width:18px;height:3px;background:var(--orange);border-radius:2px}
.list{display:flex;flex-direction:column;gap:6px}
.exp{display:flex;justify-content:space-between;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:6px}
@media (prefers-reduced-motion:no-preference){.tasbih:active{transform:scale(.95)}}
nav.kb{display:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--navy)}
.bar{display:flex;justify-content:flex-start}.bar i{flex:none}
.score{display:flex;align-items:center;gap:14px}.ring{width:74px;height:74px;flex:none}
.quick{display:flex;gap:6px;flex-wrap:wrap}.quick button{flex:1 1 30%;background:var(--soft);color:var(--fg);font-size:13px;padding:10px 4px}
.ptimes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;text-align:center;font-size:12px}.ptimes div{padding:6px 0;border-radius:8px;background:var(--soft)}.ptimes .nx{background:var(--navy);color:#fff}
.bar i{margin-left:auto}
.dev{align-self:center;width:220px;background:linear-gradient(160deg,#2a2a2a,#0d0d0d);border-radius:46px 46px 60px 60px;padding:22px 20px 26px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:0 10px 24px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.08)}
.lcd{width:100%;background:#9fb59a;border-radius:12px;padding:10px 12px;box-shadow:inset 0 3px 8px rgba(0,0,0,.45);text-align:center;color:#1d2a1b;font-family:"Courier New",ui-monospace,monospace;font-weight:700}
.lcd .n{font-size:46px;letter-spacing:2px;line-height:1.1;font-variant-numeric:tabular-nums}.lcd small{font-size:11px;display:flex;justify-content:space-between;opacity:.75}
.gold{width:96px;height:96px;border-radius:24px;background:linear-gradient(145deg,#f3d27a,#b98a2c);display:grid;place-items:center;box-shadow:0 4px 0 #7d5c18,0 8px 14px rgba(0,0,0,.4);padding:0}
.gold:active{transform:translateY(3px);box-shadow:0 1px 0 #7d5c18,0 4px 8px rgba(0,0,0,.4)}
.gold svg{width:46px;height:46px}
.rst{background:#3a3a3a;color:#ddd;font-size:12px;border-radius:20px;padding:6px 14px}.rst.warn{background:#C2413A;color:#fff}
</style><style>
.chip{font-size:11px;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.15);color:#fff;font-weight:400}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.stages{display:flex;gap:4px;flex-wrap:wrap}
.st{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--soft);color:var(--muted)}
.st.on{background:var(--navy);color:#fff}
.big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.streak{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--orange);font-weight:500}
pre.rep{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:13px;margin:0;user-select:all}
.step{background:var(--goodbg);color:var(--good);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.step b{font-size:16px}
</style>
</head><body>

<script>
const KEY='hayati-v1';
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const td=()=>iso(new Date());
const fmt=n=>Math.round(n||0).toLocaleString('en-US');
const seed={
 salary:7000,istGoal:1000,
 budgets:[{n:'إيجار السكن',b:1250},{n:'قسط التمويل',b:1469},{n:'السيارة',b:1900},{n:'أكل وشرب',b:1800},{n:'فواتير',b:600}],
 expenses:[],income:[],prayers:{},ist:{},habitLog:{},contacts:[],
 habits:[{id:1,n:'تسجيل المصاريف قبل النوم'},{id:2,n:'أذكار الصباح والمساء'},{id:3,n:'ورد القرآن'},{id:4,n:'ساعة عمل على مشروعي'},{id:5,n:'تواصل مع عميل محتمل'}],
 goals:[{n:'صندوق طوارئ',t:5000,c:0},{n:'أول عميل استشارات',t:1,c:0},{n:'ثروة مستثمرة (2031)',t:300000,c:0}],
 debts:[{id:1,n:'التمويل البنكي',rem:80000,inst:1469,late:1469},{id:2,n:'متأخر الإيجار',rem:2500,inst:1250,late:2500}],
 debtStart:82500,leads:[],city:'Riyadh',paidFixed:{},salaryIn:{},
 quick:[{n:'قهوة',a:15,cat:'أكل وشرب'},{n:'غداء',a:35,cat:'أكل وشرب'},{n:'بقالة',a:100,cat:'أكل وشرب'},{n:'بنزين',a:50,cat:'السيارة'}],
 fixed:['إيجار السكن','قسط التمويل','السيارة','فواتير']
};
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S)S=structuredClone(seed);
for(const k in seed)if(S[k]===undefined)S[k]=structuredClone(seed[k]);
let tab='home',sb=null,uid=null,sync='local',saveT=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
 if(sb&&uid){clearTimeout(saveT);sync='saving';paintSync();saveT=setTimeout(async()=>{const {error}=await sb.from('darbi_data').upsert({user_id:uid,state:S,updated_at:new Date().toISOString()});sync=error?'err':'ok';paintSync()},700)}}
function paintSync(){const el=document.getElementById('sync');if(!el)return;el.textContent={local:'محفوظ على الجهاز',saving:'جارٍ الحفظ…',ok:'محفوظ في السحابة',err:'تعذّر الحفظ السحابي'}[sync]}
const SB_URL='https://gzhfzgmphuftwlfmrxdh.supabase.co',SB_KEY='sb_publishable_oOVJuAl5bhqsPo1Ynek7KA_t5iM1lvJ';
async function loadCloud(){const {data,error}=await sb.from('darbi_data').select('state').eq('user_id',uid).maybeSingle();
 if(error){sync='err';return}
 if(data&&data.state&&Object.keys(data.state).length){const c=data.state;for(const k in seed)if(c[k]===undefined)c[k]=structuredClone(seed[k]);S=c;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}sync='ok'}
 else save()}
function loginView(msg=''){document.getElementById('nav').hidden=true;document.getElementById('app').innerHTML=`<div class="card"><h2>تسجيل الدخول</h2><div class="muted">بياناتك محمية بحسابك ولا يراها أحد غيرك.</div>
 <input id="le" type="email" placeholder="البريد الإلكتروني" autocomplete="email"><input id="lp" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" autocomplete="current-password">
 <button data-act="login">دخول</button><button class="ghost" data-act="signup">إنشاء حساب جديد</button>${msg?`<div class="alert" style="background:var(--soft);color:var(--fg)">${msg}</div>`:''}</div>`}

const LK='darbi-faceid';
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const lockOn=()=>{try{return localStorage.getItem(LK)}catch(e){return null}};
function lockView(msg=''){document.getElementById('nav').hidden=true;document.getElementById('app').innerHTML=`<div class="card" style="align-items:center;text-align:center;padding-block:32px"><svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 9v1M15 9v1M12 9v4h-1M9.5 15.5a3.5 3.5 0 0 0 5 0"/></svg><h2 style="justify-content:center">التطبيق مقفول</h2><button data-act="unlock" style="width:100%">افتح ببصمة الوجه</button>${msg?`<div class="muted">${msg}</div>`:''}</div>`}
async function enableFace(){const id=crypto.getRandomValues(new Uint8Array(16));
 const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'دربي وكفاحي'},user:{id,name:'darbi',displayName:'دربي وكفاحي'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000}});
 localStorage.setItem(LK,b64(c.rawId))}
async function unlockFace(){await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:ub64(lockOn())}],userVerification:'required',timeout:60000}})}
let unlocked=false;
async function boot(){sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
 const {data:{session}}=await sb.auth.getSession();
 if(!session){loginView();return}
 if(lockOn()&&!unlocked){lockView();return}
 uid=session.user.id;document.getElementById('nav').hidden=false;await loadCloud();render()}
const ic={home:'<path d="M3 11l9-8 9 8v10H3z"/>',dash:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',money:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>',faith:'<path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z"/>',habits:'<path d="M4 12l5 5L20 6"/>',goals:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>'};
const tabs=[['home','الرئيسية'],['dash','اللوحة'],['money','المال'],['faith','عباداتي'],['habits','عاداتي'],['goals','أهدافي']];
const mon=(off=0)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off);return iso(d).slice(0,7)};
const monthExp=(m=mon())=>S.expenses.filter(e=>e.d.startsWith(m));
const monthInc=(m=mon())=>S.income.filter(e=>e.d.startsWith(m));
const sum=a=>a.reduce((x,e)=>x+e.a,0);
const spentBy=n=>sum(monthExp().filter(e=>e.cat===n));
const totalB=()=>S.budgets.reduce((a,b)=>a+b.b,0);
const prayNames=['الفجر','الظهر','العصر','المغرب','العشاء'];
const daysBack=n=>{const r=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);r.push(iso(d))}return r};
function streak(test){let n=0;const d=new Date();if(!test(iso(d)))d.setDate(d.getDate()-1);while(test(iso(d))){n++;d.setDate(d.getDate()-1)}return n}
const prayStreak=()=>streak(k=>(S.prayers[k]||[]).filter(Boolean).length===5);
const habStreak=id=>streak(k=>(S.habitLog[k]||{})[id]);
const debtTotal=()=>S.debts.reduce((a,d)=>a+d.rem,0);
function freeDate(){const t=debtTotal(),pay=S.debts.reduce((a,d)=>a+(d.rem>0?d.inst:0),0)+sum(monthInc());if(!t)return'تحررت ✓';if(!pay)return'—';const d=new Date();d.setMonth(d.getMonth()+Math.ceil(t/pay));return d.toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{month:'long',year:'numeric'})}

// خطة الـ90 يومًا
const START=new Date(2026,9,24);
const rhythm={6:'تخطيط الأسبوع + تحديد 5 عملاء محتملين بالأسماء',0:'تواصل مع عميلَين + ساعة عمل على المشروع',1:'ساعة ونصف عمل على المشروع',2:'تواصل مع عميلَين + متابعة الردود',3:'ساعة ونصف مشروع + تواصل مع عميل واحد',4:'ساعتان مشروع + المحاسبة الأسبوعية 7:43 م',5:'يوم المال: مراجعة المصروفات + خطوة في المتأخرات أو السيارة'};
function dayStep(){const now=new Date();const n=Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate())-START)/864e5)+1;

 ${tile('باقي الديون',fmt(debtTotal()),'bad')}${tile('سُدّد من الديون',Math.round(dp)+'%')}${tile('مواظبة الصلاة 30 يوم',prRate+'%',prRate>=90?'good':'bad')}${tile('استغفار 30 يوم',fmt(ist30))}
 ${tile('تواصلات الأسبوع',wc+' / 5',wc>=5?'good':'bad')}${tile('عملاء مكتسبون',clients)}</div></div>
 <div class="card"><h2>المصروف اليومي — آخر 30 يومًا</h2>
 <svg viewBox="0 0 ${W} ${H+18}" style="width:100%;height:auto">${[0,.5,1].map(t=>`<line x1="0" x2="${W}" y1="${H-t*H}" y2="${H-t*H}" stroke="var(--line)"/>`).join('')}
 ${byDay.map((v,i)=>`<rect x="${i*bw+1}" y="${H-v/mx*H}" width="${bw-2}" height="${v/mx*H}" rx="1.5" fill="${i===29?'var(--orange)':'var(--navy)'}"/>`).join('')}
 <text x="${W}" y="${H+14}" font-size="9" fill="var(--muted)" text-anchor="end">قبل 30 يوم</text><text x="0" y="${H+14}" font-size="9" fill="var(--muted)">اليوم</text></svg>
 <div class="muted">أعلى يوم: ${fmt(mx===1&&!byDay.some(Boolean)?0:mx)} ريال · متوسط يومي: ${fmt(sum(S.expenses.filter(e=>d30.includes(e.d)))/30)} ريال</div></div>
 <div class="card"><h2>المصروف حسب البند</h2>${cats.map(c=>`<div><div class="row"><span>${c.n}</span><span class="num ${c.s>c.b?'bad':''}">${fmt(c.s)} من ${fmt(c.b)}</span></div><div class="bar"><i style="width:${c.b?Math.min(100,c.s/c.b*100):0}%;background:${c.s>c.b?'var(--bad)':'var(--navy)'}"></i></div></div>`).join('')}</div>
 <div class="card"><h2>الصلوات — آخر 14 يومًا</h2><div style="display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:3px;align-items:end;height:70px">${pr.map((n,i)=>`<div title="${d14[i]}" style="height:${Math.max(4,n*20)}%;background:${n===5?'var(--good)':n>=3?'var(--orange)':'var(--bad)'};border-radius:3px"></div>`).join('')}</div><div class="muted">أخضر = 5 صلوات · برتقالي = 3–4 · أحمر = أقل</div></div>
 <div class="card"><h2>الالتزام بالعادات — آخر 30 يومًا</h2>${hab.map(h=>`<div><div class="row"><span>${h.n}</span><span class="num">${h.r} / 30</span></div><div class="bar"><i style="width:${h.r/30*100}%;background:var(--good)"></i></div></div>`).join('')}</div>
 <div class="card"><h2>الأهداف</h2>${S.goals.map(g=>`<div><div class="row"><span>${g.n}</span><span class="num muted">${Math.round(Math.min(100,g.c/g.t*100))}%</span></div><div class="bar"><i style="width:${Math.min(100,g.c/g.t*100)}%;background:var(--orange)"></i></div></div>`).join('')}</div>`;
}

let confirmRst=false,showIg=false,PT=null,ptCity=null;
async function loadPT(){if(ptCity===S.city&&PT)return;ptCity=S.city;try{const r=await fetch('https://api.aladhan.com/v1/timingsByCity?city='+encodeURIComponent(S.city)+'&country=Saudi%20Arabia&method=4');const j=await r.json();const t=j.data.timings;PT=[t.Fajr,t.Dhuhr,t.Asr,t.Maghrib,t.Isha];if(tab==='faith'||tab==='home')render()}catch(e){PT=null}}
function nextPrayer(){if(!PT)return -1;const n=new Date(),m=n.getHours()*60+n.getMinutes();for(let i=0;i<5;i++){const[h,mm]=PT[i].split(':').map(Number);if(h*60+mm>m)return i}return 0}
function untilNext(i){const[h,mm]=PT[i].split(':').map(Number);const n=new Date();let d=h*60+mm-(n.getHours()*60+n.getMinutes());if(d<0)d+=1440;return d>=60?`${Math.floor(d/60)} س ${d%60} د`:`${d} دقيقة`}
function ptCard(){if(!PT)return `<div class="muted">جارٍ تحميل أوقات الصلاة لمدينة ${S.city}…</div>`;const nx=nextPrayer();
 return `<div class="ptimes">${prayNames.map((n,i)=>`<div class="${i===nx?'nx':''}">${n}<br><b class="num">${PT[i]}</b></div>`).join('')}</div><div class="muted">الصلاة القادمة: ${prayNames[nx]} بعد ${untilNext(nx)}</div>`}
function dayScore(){const d=td(),p=(S.prayers[d]||[]).filter(Boolean).length*8;
 const h=S.habits.length?S.habits.filter(x=>(S.habitLog[d]||{})[x.id]).length/S.habits.length*30:0;
 const food=sum(S.expenses.filter(e=>e.d===d&&e.cat==='أكل وشرب')),over=S.budgets.some(b=>spentBy(b.n)>b.b);
 const bud=(food<=64?12:0)+(over?0:8),ist=Math.min(1,(S.ist[d]||0)/S.istGoal)*10;return Math.round(p+h+bud+ist)}
function ring(v){const c=2*Math.PI*30,col=v>=80?'var(--good)':v>=50?'var(--orange)':'var(--bad)';return `<svg class="ring" viewBox="0 0 74 74"><circle cx="37" cy="37" r="30" fill="none" stroke="var(--soft)" stroke-width="8"/><circle cx="37" cy="37" r="30" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 37 37)"/><text x="37" y="43" text-anchor="middle" font-size="18" font-weight="700" fill="var(--fg)">${v}</text></svg>`}
function fixedCard(){const m=mon(),pf=S.paidFixed[m]||{},items=S.budgets.filter(b=>S.fixed.includes(b.n));const left=items.filter(b=>!pf[b.n]);
 return `<div class="card"><h2>مستحقات الشهر <span class="num ${left.length?'bad':'good'}">${items.length-left.length} / ${items.length}</span></h2>
 ${items.map(b=>`<div class="row" style="align-items:center"><span>${pf[b.n]?'✓ ':''}${b.n} · <span class="num">${fmt(b.b)}</span></span>${pf[b.n]?'<span class="good">مدفوع</span>':`<button class="ghost" data-act="payFix" data-n="${b.n}" style="padding:6px 12px">دفعت</button>`}</div>`).join('')}
 <div class="muted">«دفعت» يسجّل المبلغ مصروفًا في بنده تلقائيًا.</div></div>`}
function salaryCard(){const m=mon();if(S.salaryIn[m])return'';const day=new Date().getDate();if(day<20&&day>5)return'';
 return `<div class="card" style="border:2px solid var(--orange)"><h2>نزل الراتب؟</h2><div class="muted">وزّعه فور نزوله، وادفع لنفسك أولًا:</div>
 ${S.budgets.map(b=>`<div class="row"><span>${b.n}</span><span class="num">${fmt(b.b)}</span></div>`).join('')}
 <div class="row"><b>المتبقي بعد التوزيع</b><b class="num ${S.salary-totalB()<0?'bad':'good'}">${fmt(S.salary-totalB())}</b></div>
 <button data-act="salIn">نزل الراتب ✓ ووزّعته</button></div>`}
const views={home,dash,money,faith,habits,goals};
function render(){
 document.getElementById('today').innerHTML=`<div class="hdr"><span>${new Date().toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{weekday:'long',day:'numeric',month:'long'})}</span><span class="chip" id="sync"></span></div>`;
 paintSync();
 document.getElementById('app').innerHTML=views[tab]();
 document.getElementById('nav').innerHTML=tabs.map(([k,l])=>`<button class="${k===tab?'act':''}" data-tab="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">${ic[k]}</svg>${l}</button>`).join('');
}
const v=id=>document.getElementById(id)?.value?.trim();
const mark=(d,h)=>{S.habitLog[d]=S.habitLog[d]||{};S.habitLog[d][h]=true};
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();scrollTo(0,0);return}
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,i=+b.dataset.i,id=+b.dataset.id,d=td();
 if(a==='login'||a==='signup'){const em=v('le'),pw=document.getElementById('lp').value;if(!em||pw.length<6){loginView('اكتب البريد وكلمة مرور من 6 أحرف على الأقل.');return}
  b.textContent='لحظة…';const r=a==='login'?await sb.auth.signInWithPassword({email:em,password:pw}):await sb.auth.signUp({email:em,password:pw});
  if(r.error){loginView(a==='login'?'البريد أو كلمة المرور غير صحيحة، أو لم تؤكد بريدك بعد.':'تعذّر إنشاء الحساب: '+r.error.message);return}
  if(a==='signup'&&!r.data.session){loginView('تم إنشاء الحساب. افتح بريدك واضغط رابط التأكيد، ثم ارجع هنا وسجّل الدخول.');return}
  boot();return}
 if(a==='rst'){if(!confirmRst){confirmRst=true;render();setTimeout(()=>{if(confirmRst){confirmRst=false;if(tab==='faith')render()}},3000);return}confirmRst=false;S.ist[d]=0;save();render();return}
 if(a==='igT'){showIg=!showIg;render();return}
 if(a==='city'){document.getElementById('cityBox').innerHTML=`<div class="form"><select id="cs">${['Riyadh','Jeddah','Makkah','Madinah','Dammam','Khobar','Taif','Abha','Tabuk','Buraydah','Hail','Jazan','Najran','Al Ahsa'].map(c=>`<option ${c===S.city?'selected':''}>${c}</option>`).join('')}</select><button data-act="setCity">حفظ</button></div>`;return}
 if(a==='setCity'){S.city=v('cs');PT=null;save();render();return}
 if(a==='qx'){const q=S.quick[i];S.expenses.push({id:Date.now(),d,a:q.a,cat:q.cat,n:q.n});mark(d,1);save();render();return}
 if(a==='payFix'){const n=b.dataset.n,bb=S.budgets.find(x=>x.n===n),m=mon();S.paidFixed[m]=S.paidFixed[m]||{};S.paidFixed[m][n]=true;S.expenses.push({id:Date.now(),d,a:bb.b,cat:n,n:'مستحق شهري'});mark(d,1);
  if(n==='قسط التمويل'){const debt=S.debts.find(x=>x.n.includes('التمويل'));if(debt){debt.rem=Math.max(0,debt.rem-bb.b);debt.late=Math.max(0,debt.late-bb.b)}}save();render();return}
 if(a==='salIn'){S.salaryIn[mon()]=true;save();render();return}
 if(a==='unlock'){try{await unlockFace();unlocked=true;boot()}catch(_){lockView('لم يتم التحقق. حاول مرة أخرى.')}return}
 if(a==='face'){const m=document.getElementById('fMsg');if(lockOn()){try{localStorage.removeItem(LK)}catch(_){}m.textContent='تم إيقاف القفل.';b.textContent='تفعيل القفل ببصمة الوجه';return}
  try{await enableFace();m.textContent='تم التفعيل ✓ سيُطلب منك Face ID عند فتح التطبيق.';b.textContent='إيقاف القفل ببصمة الوجه'}catch(_){m.textContent='تعذّر التفعيل. تأكد أن Face ID مفعّل في جوالك.'}return}
 if(a==='chpw'){const pw=document.getElementById('np').value,m=document.getElementById('pwMsg');if(pw.length<6){m.textContent='كلمة المرور 6 أحرف على الأقل.';return}const r=await sb.auth.updateUser({password:pw});m.textContent=r.error?'تعذّر التغيير، حاول مرة أخرى.':'تم تغيير كلمة المرور ✓';if(!r.error)document.getElementById('np').value='';return}
 if(a==='logout'){await sb.auth.signOut();uid=null;loginView();return}
 if(a==='rep'){const txt=report();document.getElementById('repBox').innerHTML=`<pre class="rep" id="repTxt"></pre><button class="ghost" data-act="copy">نسخ التقرير</button>`;document.getElementById('repTxt').textContent=txt;return}
 if(a==='copy'){const txt=document.getElementById('repTxt').textContent;try{await navigator.clipboard.writeText(txt);b.textContent='تم النسخ'}catch(_){const r=document.createRange();r.selectNodeContents(document.getElementById('repTxt'));getSelection().removeAllRanges();getSelection().addRange(r);b.textContent='حدّد النص وانسخه'}return}
 if(a==='addExp'){const n=+v('ea');if(!n)return;S.expenses.push({id:Date.now(),d,a:n,cat:v('ec'),n:v('en')});mark(d,1);
  const debt=S.debts.find(x=>x.n.includes('التمويل')&&v('ec')==='قسط التمويل');if(debt){debt.rem=Math.max(0,debt.rem-n);debt.late=Math.max(0,debt.late-n)}}
 if(a==='delE')S.expenses=S.expenses.filter(x=>x.id!==id);
 if(a==='addInc'&&+v('ia'))S.income.push({id:Date.now(),d,a:+v('ia'),s:v('is')});
 if(a==='delI')S.income=S.income.filter(x=>x.id!==id);
 if(a==='setSal')S.salary=+v('sal')||S.salary;
 if(a==='addB'&&v('bn')&&+v('bb'))S.budgets.push({n:v('bn'),b:+v('bb')});
 if(a==='delB')S.budgets.splice(i,1);
 if(a==='pay'){const n=+v('dp'+i);if(n){const x=S.debts[i];x.rem=Math.max(0,x.rem-n);x.late=Math.max(0,x.late-n)}}
 if(a==='addD'&&v('dn')&&+v('dr')){S.debts.push({id:Date.now(),n:v('dn'),rem:+v('dr'),inst:+v('di')||0,late:0});S.debtStart+= +v('dr')}
 if(a==='delD')S.debts.splice(i,1);
 if(a==='pray'){S.prayers[d]=S.prayers[d]||[false,false,false,false,false];S.prayers[d][i]=!S.prayers[d][i]}
 if(a==='ist')S.ist[d]=(S.ist[d]||0)+1;
 if(a==='ist10')S.ist[d]=(S.ist[d]||0)+10;
 if(a==='ist100')S.ist[d]=(S.ist[d]||0)+100;
 if(a==='setIg')S.istGoal=+v('ig')||S.istGoal;
 if(a==='hab'){S.habitLog[d]=S.habitLog[d]||{};S.habitLog[d][id]=!S.habitLog[d][id]}
 if(a==='addH'&&v('hn'))S.habits.push({id:Date.now(),n:v('hn')});
 if(a==='delH')S.habits=S.habits.filter(h=>h.id!==id);
 if(a==='gAdd')S.goals[i].c+=+v('gc'+i)||0;
 if(a==='addG'&&v('gn')&&+v('gt'))S.goals.push({n:v('gn'),t:+v('gt'),c:0});
 if(a==='addL'&&v('ln'))S.leads.push({n:v('ln'),s:0});
 if(a==='delL')S.leads.splice(i,1);
 if(a==='adv'){const l=S.leads[i];l.s++;if(l.s===1){S.contacts.push(d);mark(d,5)}if(l.s===4){const g=S.goals.find(g=>g.n.includes('عميل'));if(g)g.c++}}
 save();render();
});
document.addEventListener('focusin',e=>{if(e.target.matches('input,select,textarea'))document.getElementById('nav').classList.add('kb')});
document.addEventListener('focusout',()=>setTimeout(()=>{if(!document.activeElement||!document.activeElement.matches('input,select,textarea'))document.getElementById('nav').classList.remove('kb')},100));
boot();
